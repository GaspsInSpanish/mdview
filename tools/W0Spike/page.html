<!doctype html><html><head><meta charset="utf-8"><title>mdview W0 spike</title>
<style nonce="{{NONCE}}">
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font:14px "Segoe UI",sans-serif;background:#f5f3ed;color:#111}
#titlebar{height:30px;display:flex;align-items:center;padding:3px 4px;background:linear-gradient(90deg,#000080,#1084D0);color:white;font-weight:bold;app-region:drag;-webkit-app-region:drag;user-select:none}
#title{flex:1;padding-left:4px}.buttons{display:flex;gap:3px;app-region:no-drag;-webkit-app-region:no-drag}
button{width:25px;height:23px;padding:0;background:#C9C5B9;border:0;border-top:1px solid #fff;border-left:1px solid #fff;border-right:1px solid #88847A;border-bottom:1px solid #88847A;box-shadow:inset 1px 1px 0 #E7E3D9,inset -1px -1px 0 #A8A499;font:bold 14px Arial;line-height:19px}
button:active{border-top-color:#88847A;border-left-color:#88847A;border-right-color:#fff;border-bottom-color:#fff;box-shadow:inset 1px 1px 0 #A8A499,inset -1px -1px 0 #E7E3D9}main{padding:18px}code{background:#ddd8cc;padding:2px 4px}
</style></head><body>
<div id="titlebar"><span id="title">mdview WebView2 / raw HWND spike</span><div class="buttons"><button data-command="minimize" aria-label="Minimize">_</button><button data-command="maximize" aria-label="Maximize or restore">□</button><button data-command="close" aria-label="Close">X</button></div></div>
<main><b>Try:</b> drag the title bar; double-click it; drag to screen edges to snap; resize from every border and corner; press <code>Alt+Space</code> for the system menu.</main>
<img src="missing-spike-image" onerror="window.__inlineHandlerRan=true">
<script nonce="{{NONCE}}">
window.__nonceScriptRan=true;window.__inlineHandlerRan=false;
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>chrome.webview.postMessage({type:'command',command:b.dataset.command})));
chrome.webview.addEventListener('message',e=>{if(e.data&&e.data.type==='ping')chrome.webview.postMessage({type:'pong',sent:e.data.sent});});
addEventListener('load',()=>setTimeout(()=>{const t=document.getElementById('titlebar'),s=getComputedStyle(t);chrome.webview.postMessage({type:'page-ready',nonceRan:window.__nonceScriptRan===true,inlineHandlerRan:window.__inlineHandlerRan===true,appRegion:s.getPropertyValue('app-region'),webkitAppRegion:s.getPropertyValue('-webkit-app-region')||s.webkitAppRegion,titleRect:{left:t.getBoundingClientRect().left,top:t.getBoundingClientRect().top,width:t.getBoundingClientRect().width,height:t.getBoundingClientRect().height}});},100));
</script></body></html>
