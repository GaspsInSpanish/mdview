name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.2.3 or v1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Derive version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME }
          $version = $tag -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'A release version is required.' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish mdview
        shell: pwsh
        run: dotnet publish src/MdView/MdView.csproj -c Release -r win-x64 -p:Version=$env:VERSION
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup --no-progress --yes
            $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          }
          $isccPath = if ($iscc) { $iscc.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $isccPath)) { throw 'Inno Setup could not be located after installation.' }
          "ISCC=$isccPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build installer
        shell: pwsh
        run: '& "$env:ISCC" "/DAppVersion=$env:VERSION" "installer\mdview.iss"'
      - name: Create checksum
        shell: pwsh
        run: |
          $installer = "installer\Output\mdview-setup-$env:VERSION.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -NoNewline "${installer}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            installer/Output/mdview-setup-${{ env.VERSION }}.exe
            installer/Output/mdview-setup-${{ env.VERSION }}.exe.sha256

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Derive version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then tag=$INPUT_VERSION; else tag=$GITHUB_REF_NAME; fi
          version=${tag#v}; [[ -n "$version" ]]; echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build Mac disk images
        run: |
          set -euo pipefail
          packaging/macos/build-app.sh osx-arm64 "$VERSION" "$RUNNER_TEMP/release"
          packaging/macos/build-app.sh osx-x64 "$VERSION" "$RUNNER_TEMP/release"
          packaging/macos/build-app.sh osx-arm64 "$VERSION" "$RUNNER_TEMP/smoke" --smoke
          cd "$RUNNER_TEMP/release"
          for file in *.dmg; do hash=$(shasum -a 256 "$file" | awk '{print $1}'); printf '%s  %s\n' "$hash" "$file" > "$file.sha256"; done
      - name: Smoke arm64 app and start shipped app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-app" "$RUNNER_TEMP/smoke-app"
          hdiutil attach "$RUNNER_TEMP/release/mdview-$VERSION-macos-arm64.dmg" -mountpoint "$RUNNER_TEMP/release-mount" -nobrowse
          cp -R "$RUNNER_TEMP/release-mount/mdview.app" "$RUNNER_TEMP/release-app/mdview.app"
          hdiutil detach "$RUNNER_TEMP/release-mount"
          hdiutil attach "$RUNNER_TEMP/smoke/mdview-$VERSION-macos-arm64.dmg" -mountpoint "$RUNNER_TEMP/smoke-mount" -nobrowse
          cp -R "$RUNNER_TEMP/smoke-mount/mdview.app" "$RUNNER_TEMP/smoke-app/mdview.app"
          hdiutil detach "$RUNNER_TEMP/smoke-mount"
          bash tools/MacSmoke/smoke.sh "$RUNNER_TEMP/smoke-app/mdview.app" direct
          bash tools/MacSmoke/startup.sh "$RUNNER_TEMP/release-app/mdview.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: ${{ runner.temp }}/release/*

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Derive version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then tag=$INPUT_VERSION; else tag=$GITHUB_REF_NAME; fi
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "mdview $VERSION" --generate-notes
